<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe OS - Seed Dock (Submit)</title>
    <link rel="stylesheet" href="./assets/observatory-ui.css">
</head>
<body>
    <canvas id="sceneCanvas" class="scene-canvas" aria-hidden="true"></canvas>
    <div class="scene-scrim scene-scrim--modal"></div>

    <main class="page-shell" style="display: flex; align-items: center; justify-content: center;">
        <section class="glass-panel overlay-narrow" style="padding: 1.2rem;">
            <div class="panel-stack">
                <div class="panel-header">
                    <div>
                        <p class="mini-label">Seed Dock // Submit</p>
                        <h1 style="margin: 0.45rem 0 0; font-size: 1.4rem;">Cast a new knowledge seed into the universe.</h1>
                    </div>
                    <button class="ghost-button">Close</button>
                </div>

                <div class="toolbar">
                    <button class="toolbar-button">Text</button>
                    <button class="toolbar-button">Document</button>
                    <div class="pill">Anonymous by default</div>
                </div>

                <label>
                    <span class="mini-label">Title</span>
                    <input class="text-input" placeholder="Name this seed">
                </label>

                <label>
                    <span class="mini-label">Content</span>
                    <textarea class="text-area" placeholder="Share a new idea, document, correction, or question. Markdown is welcome."></textarea>
                </label>

                <div class="drop-zone">
                    <p style="margin: 0; font-weight: 500;">Drop files here or browse</p>
                    <p class="muted" style="margin: 0.5rem 0 0;">Markdown, PDF, and image uploads stay subordinate to the same seed workflow.</p>
                </div>

                <div class="toolbar" style="justify-content: space-between;">
                    <div class="pill">Ready to seed</div>
                    <div class="toolbar">
                        <button class="ghost-button">Save Draft</button>
                        <button class="primary-button">Cast into Universe</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="runtime-corner">
        <div class="runtime-pill"><span id="runtimeLabel">Initializing WebGPU observatory...</span></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.min.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.min.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import { bootObservatoryStage } from "./assets/observatory-stage.js";

        bootObservatoryStage({
            canvas: document.getElementById("sceneCanvas"),
            preset: "seed",
            statusEl: document.getElementById("runtimeLabel")
        });
    </script>
</body>
</html>
