<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galactic Star Map Observatory</title>
    <style>
      :root {
        color-scheme: dark;
        --scale-progress: 0.12;
        --axis-glow: rgba(190, 222, 255, 0.78);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #02040a;
        color: rgba(230, 240, 255, 0.9);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-width: 960px;
      }

      .galaxy-shell {
        position: fixed;
        inset: 0;
        isolation: isolate;
        background:
          radial-gradient(circle at 52% 48%, rgba(42, 57, 86, 0.18), transparent 34%),
          radial-gradient(circle at 50% 88%, rgba(13, 19, 34, 0.7), transparent 52%),
          #02040a;
      }

      .galaxy-canvas,
      .label-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .galaxy-canvas {
        z-index: 0;
        cursor: grab;
        touch-action: none;
      }

      .galaxy-canvas.is-dragging {
        cursor: grabbing;
      }

      .label-canvas {
        z-index: 1;
        pointer-events: none;
      }

      .scale-axis {
        position: absolute;
        z-index: 2;
        top: 50%;
        right: 28px;
        width: 54px;
        height: min(38vh, 320px);
        min-height: 220px;
        transform: translateY(-50%);
        opacity: 0.84;
        pointer-events: none;
      }

      .scale-axis::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        right: 12px;
        width: 1px;
        background: linear-gradient(
          to bottom,
          rgba(185, 220, 255, 0),
          rgba(185, 220, 255, 0.42) 18%,
          rgba(185, 220, 255, 0.44) 82%,
          rgba(185, 220, 255, 0)
        );
      }

      .scale-axis__dot {
        position: absolute;
        right: 7px;
        top: calc((1 - var(--scale-progress)) * 100%);
        width: 11px;
        height: 11px;
        border-radius: 50%;
        transform: translateY(-50%);
        background: #eaf4ff;
        box-shadow:
          0 0 14px var(--axis-glow),
          0 0 34px rgba(105, 172, 255, 0.42);
      }

      .scale-axis__tick {
        position: absolute;
        right: 11px;
        width: 8px;
        height: 1px;
        background: rgba(210, 230, 255, 0.42);
      }

      .scale-axis__tick::after {
        content: attr(data-label);
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        color: rgba(216, 230, 250, 0.48);
        font-size: 10px;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .scale-axis__tick[data-lod="local"] {
        top: 0;
      }

      .scale-axis__tick[data-lod="regional"] {
        top: 50%;
      }

      .scale-axis__tick[data-lod="galactic"] {
        bottom: 0;
      }

      .boot-status {
        position: absolute;
        z-index: 3;
        left: 28px;
        bottom: 24px;
        max-width: 320px;
        padding: 0;
        color: rgba(221, 232, 248, 0.72);
        font-size: 12px;
        line-height: 1.5;
        letter-spacing: 0;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.72);
        transition:
          opacity 420ms ease,
          transform 420ms ease;
      }

      .boot-status[data-ready="true"] {
        opacity: 0.72;
      }

      .boot-status[data-hidden="true"] {
        opacity: 0;
        transform: translateY(8px);
      }

      .debug-line {
        position: absolute;
        z-index: 3;
        left: 28px;
        top: 22px;
        display: none;
        color: rgba(203, 226, 255, 0.66);
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0;
        white-space: pre;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8);
      }

      .debug-line[data-enabled="true"] {
        display: block;
      }

      .unsupported {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: none;
        place-items: center;
        padding: 32px;
        background: rgba(2, 4, 10, 0.92);
        color: rgba(230, 240, 255, 0.82);
        text-align: center;
        font-size: 14px;
        line-height: 1.7;
      }

      .unsupported[data-visible="true"] {
        display: grid;
      }

      @media (max-width: 980px) {
        body {
          min-width: 0;
        }

        .scale-axis {
          right: 16px;
          height: 230px;
        }

        .scale-axis__tick::after {
          display: none;
        }

        .boot-status,
        .debug-line {
          left: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="galaxy-shell" id="galaxy-shell">
      <canvas class="galaxy-canvas" id="galaxy-canvas" aria-label="Galactic star map"></canvas>
      <canvas class="label-canvas" id="galaxy-labels" aria-hidden="true"></canvas>

      <div class="scale-axis" id="scale-axis" aria-hidden="true">
        <span class="scale-axis__tick" data-lod="local" data-label="Local"></span>
        <span class="scale-axis__tick" data-lod="regional" data-label="Regional"></span>
        <span class="scale-axis__tick" data-lod="galactic" data-label="Galactic"></span>
        <span class="scale-axis__dot"></span>
      </div>

      <div class="boot-status" id="boot-status" aria-live="polite"></div>
      <div class="debug-line" id="debug-line"></div>
      <div class="unsupported" id="unsupported"></div>
    </main>

    <script type="module">
      import { bootGalacticStarMap } from "./assets/galactic-star-map-runtime.js?v=galactic-star-map-20260428-fresh";

      bootGalacticStarMap({
        root: document.getElementById("galaxy-shell"),
        canvas: document.getElementById("galaxy-canvas"),
        labelCanvas: document.getElementById("galaxy-labels"),
        scaleAxis: document.getElementById("scale-axis"),
        status: document.getElementById("boot-status"),
        debugLine: document.getElementById("debug-line"),
        unsupported: document.getElementById("unsupported")
      });
    </script>
  </body>
</html>
