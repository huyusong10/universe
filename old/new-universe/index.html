<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Universe Galactic Observatory</title>
    <style>
      :root {
        color-scheme: dark;
        --zoom-position: 0.08;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #02040a;
        color: rgba(232, 241, 255, 0.9);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-width: 920px;
      }

      .observatory {
        position: fixed;
        inset: 0;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 50%, rgba(40, 51, 73, 0.12), transparent 36%),
          radial-gradient(circle at 50% 100%, rgba(7, 10, 18, 0.82), transparent 56%),
          #02040a;
      }

      canvas {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }

      canvas.is-dragging {
        cursor: grabbing;
      }

      .scale {
        position: absolute;
        z-index: 1;
        top: 50%;
        right: 28px;
        width: 54px;
        height: min(36vh, 320px);
        min-height: 224px;
        transform: translateY(-50%);
        pointer-events: none;
        opacity: 0.78;
      }

      .scale::before {
        content: "";
        position: absolute;
        top: 0;
        right: 12px;
        bottom: 0;
        width: 1px;
        background: linear-gradient(
          to bottom,
          rgba(184, 218, 255, 0),
          rgba(184, 218, 255, 0.48) 18%,
          rgba(184, 218, 255, 0.38) 82%,
          rgba(184, 218, 255, 0)
        );
      }

      .scale__dot {
        position: absolute;
        top: calc((1 - var(--zoom-position)) * 100%);
        right: 7px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        transform: translateY(-50%);
        background: rgba(239, 247, 255, 0.98);
        box-shadow:
          0 0 14px rgba(196, 225, 255, 0.78),
          0 0 34px rgba(112, 166, 230, 0.38);
      }

      .scale__tick {
        position: absolute;
        right: 11px;
        width: 8px;
        height: 1px;
        background: rgba(213, 230, 255, 0.42);
      }

      .scale__tick::after {
        content: attr(data-label);
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        color: rgba(218, 230, 250, 0.46);
        font-size: 10px;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .scale__tick:nth-child(1) {
        top: 0;
      }

      .scale__tick:nth-child(2) {
        top: 50%;
      }

      .scale__tick:nth-child(3) {
        bottom: 0;
      }

      .status,
      .debug {
        position: absolute;
        z-index: 2;
        left: 28px;
        color: rgba(220, 233, 252, 0.7);
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.72);
        letter-spacing: 0;
        pointer-events: none;
      }

      .status {
        bottom: 24px;
        max-width: 360px;
        font-size: 12px;
        line-height: 1.5;
        transition:
          opacity 420ms ease,
          transform 420ms ease;
      }

      .status[data-hidden="true"] {
        opacity: 0;
        transform: translateY(8px);
      }

      .debug {
        top: 22px;
        display: none;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre;
      }

      .debug[data-enabled="true"] {
        display: block;
      }

      .unsupported {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: none;
        place-items: center;
        padding: 32px;
        background: rgba(2, 4, 10, 0.94);
        color: rgba(230, 240, 255, 0.82);
        text-align: center;
        font-size: 14px;
        line-height: 1.7;
      }

      .unsupported[data-visible="true"] {
        display: grid;
      }

      @media (max-width: 980px) {
        body {
          min-width: 0;
        }

        .scale {
          right: 16px;
        }

        .scale__tick::after {
          display: none;
        }

        .status,
        .debug {
          left: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="observatory" id="observatory">
      <canvas id="sky" aria-label="Scalable galactic star map"></canvas>
      <div class="scale" id="scale" aria-hidden="true">
        <span class="scale__tick" data-label="Local"></span>
        <span class="scale__tick" data-label="Regional"></span>
        <span class="scale__tick" data-label="Galactic"></span>
        <span class="scale__dot"></span>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="debug" id="debug"></div>
      <div class="unsupported" id="unsupported"></div>
    </main>

    <script type="module">
      import { bootNewUniverse } from "./assets/stellar-observatory-runtime.js";

      bootNewUniverse({
        root: document.getElementById("observatory"),
        canvas: document.getElementById("sky"),
        scale: document.getElementById("scale"),
        status: document.getElementById("status"),
        debug: document.getElementById("debug"),
        unsupported: document.getElementById("unsupported")
      });
    </script>
  </body>
</html>
