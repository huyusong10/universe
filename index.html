<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>100,000 Stars Style Observatory</title>
    <style>
      :root {
        color-scheme: dark;
        --scale-progress: 0.08;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #01040a;
        color: rgba(232, 241, 255, 0.9);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-width: 920px;
      }

      .observatory {
        position: fixed;
        inset: 0;
        isolation: isolate;
        background:
          radial-gradient(circle at 49% 48%, rgba(32, 43, 63, 0.22), transparent 28%),
          radial-gradient(circle at 50% 54%, rgba(15, 22, 36, 0.24), transparent 54%),
          radial-gradient(circle at 50% 100%, rgba(3, 7, 16, 0.92), transparent 62%),
          #01040a;
      }

      .scene-canvas,
      .label-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .scene-canvas {
        z-index: 0;
        cursor: grab;
        touch-action: none;
      }

      .scene-canvas.is-dragging {
        cursor: grabbing;
      }

      .label-canvas {
        z-index: 1;
        pointer-events: none;
      }

      .scale-axis {
        position: absolute;
        z-index: 2;
        top: 50%;
        right: 28px;
        width: 56px;
        height: min(38vh, 330px);
        min-height: 224px;
        transform: translateY(-50%);
        opacity: 0.82;
        pointer-events: none;
      }

      .scale-axis::before {
        content: "";
        position: absolute;
        top: 0;
        right: 12px;
        bottom: 0;
        width: 1px;
        background: linear-gradient(
          to bottom,
          rgba(188, 220, 255, 0),
          rgba(188, 220, 255, 0.46) 18%,
          rgba(188, 220, 255, 0.38) 82%,
          rgba(188, 220, 255, 0)
        );
      }

      .scale-axis__dot {
        position: absolute;
        top: calc((1 - var(--scale-progress)) * 100%);
        right: 7px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        transform: translateY(-50%);
        background: rgba(240, 248, 255, 0.98);
        box-shadow:
          0 0 14px rgba(196, 224, 255, 0.72),
          0 0 34px rgba(103, 166, 238, 0.34);
      }

      .scale-axis__tick {
        position: absolute;
        right: 11px;
        width: 8px;
        height: 1px;
        background: rgba(210, 230, 255, 0.4);
      }

      .scale-axis__tick::after {
        content: attr(data-label);
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        color: rgba(216, 230, 250, 0.48);
        font-size: 10px;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .scale-axis__tick {
        top: calc((1 - var(--tick-progress)) * 100%);
      }

      .status,
      .debug {
        position: absolute;
        z-index: 3;
        left: 28px;
        color: rgba(220, 233, 252, 0.72);
        letter-spacing: 0;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.76);
        pointer-events: none;
      }

      .status {
        bottom: 24px;
        max-width: 360px;
        font-size: 12px;
        line-height: 1.5;
        transition:
          opacity 420ms ease,
          transform 420ms ease;
      }

      .status[data-hidden="true"] {
        opacity: 0;
        transform: translateY(8px);
      }

      .debug {
        top: 22px;
        display: none;
        max-width: min(74vw, 1100px);
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .debug[data-enabled="true"] {
        display: block;
      }

      .unsupported {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: none;
        place-items: center;
        padding: 32px;
        background: rgba(1, 4, 10, 0.94);
        color: rgba(230, 240, 255, 0.82);
        text-align: center;
        font-size: 14px;
        line-height: 1.7;
      }

      .unsupported[data-visible="true"] {
        display: grid;
      }

      @media (max-width: 980px) {
        body {
          min-width: 0;
        }

        .scale-axis {
          right: 16px;
          height: 230px;
        }

        .scale-axis__tick::after {
          display: none;
        }

        .status,
        .debug {
          left: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="observatory" id="observatory">
      <canvas class="scene-canvas" id="scene" aria-label="Scalable galactic star map"></canvas>
      <canvas class="label-canvas" id="labels" aria-hidden="true"></canvas>
      <div class="scale-axis" id="scale-axis" aria-hidden="true">
        <span class="scale-axis__tick" data-level="surface" data-label="Surface" style="--tick-progress: 0.89"></span>
        <span class="scale-axis__tick" data-level="system" data-label="System" style="--tick-progress: 0.68"></span>
        <span class="scale-axis__tick" data-level="local" data-label="Local" style="--tick-progress: 0.51"></span>
        <span class="scale-axis__tick" data-level="regional" data-label="Regional" style="--tick-progress: 0.31"></span>
        <span class="scale-axis__tick" data-level="galactic" data-label="Galactic" style="--tick-progress: 0.09"></span>
        <span class="scale-axis__dot"></span>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="debug" id="debug"></div>
      <div class="unsupported" id="unsupported"></div>
    </main>

    <script type="module">
      const BUILD_VERSION = "newnew-stars-observatory-20260501e";
      const cacheKey = `${BUILD_VERSION}-${Date.now().toString(36)}`;
      const runtimeUrl = new URL("./assets/stars-observatory-runtime.js", window.location.href);
      runtimeUrl.searchParams.set("v", cacheKey);
      const { bootStarsObservatory } = await import(runtimeUrl.href);

      bootStarsObservatory({
        root: document.getElementById("observatory"),
        scene: document.getElementById("scene"),
        labels: document.getElementById("labels"),
        scaleAxis: document.getElementById("scale-axis"),
        status: document.getElementById("status"),
        debug: document.getElementById("debug"),
        unsupported: document.getElementById("unsupported")
      });
    </script>
  </body>
</html>
