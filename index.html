<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#03050a" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2303050a'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23eee9df' stroke-opacity='.35'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23eee9df'/%3E%3C/svg%3E" />
    <title>Universe — Cosmic Observatory</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #eee9df;
        --muted: #9c9c9d;
        --observatory-surface: #08101aee;
        --scale-progress: 0;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #03050a;
        color: var(--ink);
        font-family: "Avenir Next", Avenir, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .observatory {
        position: fixed;
        inset: 0;
        isolation: isolate;
        background: #03050a;
      }

      .scene-canvas, .label-canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        /* Keep the last frame proportional while the Worker updates its backing size. */
        object-fit: contain;
      }

      .scene-canvas {
        z-index: 0;
        touch-action: none;
        outline: none;
        cursor: grab;
      }

      .scene-canvas.is-dragging { cursor: grabbing; }

      .scene-canvas:focus-visible {
        outline: 1px solid #eee9df70;
        outline-offset: -6px;
      }

      .label-canvas { z-index: 1; pointer-events: none; }

      .observation-console {
        position: absolute; left: 32px; right: 32px; bottom: max(24px, env(safe-area-inset-bottom));
        width: min(960px, calc(100vw - 64px)); margin-inline: auto; padding: 12px 16px;
        display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 22px; align-items: center;
        border: 1px solid #b5c5df30; border-top-color: #d5c5a44d; border-radius: 12px;
        background: var(--observatory-surface); backdrop-filter: blur(18px); box-shadow: 0 10px 40px #0004;
      }
      .scale-axis { min-width: 0; pointer-events: auto; }
      .scale-axis__body { display: grid; grid-template-rows: auto 22px; gap: 2px; min-width: 0; }
      .scale-axis__stages { display: flex; gap: 3px; min-width: 0; }
      .scale-axis__tick {
        position: relative; flex: 1; min-width: 0; min-height: 40px; padding: 5px 6px;
        color: #aeb9c9; font-size: 11px; font-weight: 400; text-align: center; line-height: 1.35;
        border: 1px solid transparent; border-radius: 5px; background: transparent; cursor: pointer;
      }
      .scale-axis__tick:hover { color: #f3dfb9; background: #b4c7e214; }
      .scale-axis__tick[data-current="true"] { color: #f4e6c7; background: #d6bd7c14; border-bottom-color: #d6bd7c; }
      .scale-axis__tick[data-destination="true"] { border-color: #d6bd7c66; }
      .scale-axis__tick:focus-visible { outline: 2px solid #e9d3a4; outline-offset: 1px; }
      .scale-axis__short { display: none; }
      .scale-axis__rail { position: relative; margin-inline: 8px; }
      .scale-axis__slider {
        position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
        direction: rtl; appearance: none; background: transparent; cursor: ew-resize; touch-action: none;
      }
      .scale-axis__slider::-webkit-slider-runnable-track { height: 1px; background: #a5b0c245; }
      .scale-axis__slider::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; margin-top: -4.5px; border: 1px solid #d6bd7c; border-radius: 50%; background: #0b1423; }
      .scale-axis__slider::-moz-range-track { height: 1px; background: #a5b0c245; }
      .scale-axis__slider::-moz-range-thumb { width: 8px; height: 8px; border: 1px solid #d6bd7c; border-radius: 50%; background: #0b1423; }
      .scale-axis__slider:focus-visible { outline: 1px solid #e9d3a4; outline-offset: 1px; border-radius: 6px; }
      .scale-axis__dot {
        position: absolute; z-index: 1; left: calc(5px + (100% - 10px) * (1 - var(--scale-progress)));
        top: 50%; width: 4px; height: 4px; border-radius: 50%; transform: translate(-50%, -50%);
        background: #f4e6c7; box-shadow: 0 0 8px #eee9df66; pointer-events: none;
      }
      .scale-axis__hint { display: none; }
      .guide-card[data-map-summary="true"] { width: 310px; background: var(--observatory-surface); }
      .guide-card[data-map-summary="true"] .guide-card__header { padding-top: 20px; }
      .guide-card[data-map-summary="true"] .guide-card__name { font-size: 32px; }
      .guide-card[data-map-summary="true"] .guide-card__text,
      .guide-card[data-map-summary="true"] .guide-card__actions > :not([data-action="approach"]) { display: none; }
      .guide-card[data-map-summary="true"] .guide-card__actions { margin-top: 16px; }
      .guide-card[data-map-summary="true"] .object-evidence { margin-top: 8px; } .debug {
        position: absolute;
        z-index: 3;
        left: max(30px, env(safe-area-inset-left));
        pointer-events: none;
        text-shadow: 0 1px 8px #03050a, 0 0 16px #03050a;
      }

      .debug {
        top: max(24px, env(safe-area-inset-top));
        display: none;
        max-width: calc(100vw - 60px);
        color: #b4b1ab;
        font: 10px/1.8 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .debug[data-enabled="true"] { display: block; }

      button, summary, a { -webkit-tap-highlight-color: transparent; }
      button { font: inherit; }
      button:focus-visible, summary:focus-visible, a:focus-visible {
        outline: 2px solid #e9d7ae;
        outline-offset: 4px;
      }
      [hidden] { display: none !important; }

      .controls { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
      .controls > * { pointer-events: auto; }
      .observatory:not([data-state="ready"]) .controls,
      .observatory:not([data-state="ready"]) .observation-console { visibility: hidden; }
      .quiet-button {
        min-height: 40px; padding: 0 14px; border: 1px solid #eee9df24; border-radius: 4px;
        background: #070b13b8; color: #d7d2c9; cursor: pointer; font-size: 11px;
        backdrop-filter: blur(14px); transition: background 180ms, border-color 180ms;
      }
      .quiet-button:hover { background: #17202deb; border-color: #eee9df60; }
      .quiet-button:disabled { opacity: .45; cursor: default; }
      .quiet-button[aria-expanded="true"] { border-color: #cfbb8b80; color: #f1dfb8; }
      .guide-card {
        position: absolute; left: 30px; bottom: 74px; width: min(340px, calc(100vw - 110px));
        border-left: 1px solid #cfbb8b59;
        background: linear-gradient(110deg, #050811e8, #070b14b5 72%, #070b1470);
        box-shadow: 0 10px 40px #0003; backdrop-filter: blur(16px);
      }
      .guide-card__content { display: flex; flex-direction: column; max-height: var(--guide-space-height); }
      .guide-card__header { flex: none; padding: 22px 24px 0; }
      .guide-card__body { min-height: 0; padding: 0 24px 22px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
      .guide-card__body:focus-visible { outline: 1px solid #d4c6aa70; outline-offset: -2px; }
      .guide-card__eyebrow { margin: 0 0 9px; padding-right: 40px; color: #b8b1a4; font-size: 10px; letter-spacing: .14em; }
      .guide-card__hide { position: absolute; z-index: 1; top: 10px; right: 10px; min-width: 40px; padding: 0; border-color: transparent; background: #070b14dc; font-size: 20px; }
      .guide-restore { position: absolute; left: 30px; bottom: 74px; }
      .guide-card__name { margin: 0; font-family: "Iowan Old Style", "Songti SC", Georgia, serif; font-size: 30px; font-weight: 400; line-height: 1.15; }
      .guide-card__type { margin: 9px 0 0; color: #d4c6aa; font-size: 10px; }
      .galaxy-regions { margin-top: 14px; padding-top: 12px; border-top: 1px solid #d4c6aa20; }
      .galaxy-regions h3 { margin: 0; color: #d4c6aa; font-size: 10px; font-weight: 400; letter-spacing: .09em; }
      .galaxy-regions p { margin: 6px 0 10px; color: #939eae; font-size: 10px; line-height: 1.6; }
      .galaxy-regions__choices { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .galaxy-regions__choices button { min-height: 36px; padding: 7px 10px; font-size: 11px; }
      .galaxy-regions__choices [aria-pressed="true"] { border-color: #cdbb94aa; color: #f1dfb8; background: #cdbb9412; }
      .galaxy-whole-control { position: absolute; left: 30px; bottom: 70px; z-index: 5; }
      @media (max-width: 600px) { .galaxy-whole-control { left: 18px; bottom: 74px; } }
      .space-context { margin-top: 13px; padding: 10px 0; border-block: 1px solid #d4c6aa20; }
      .space-context p { margin: 0; line-height: 1.6; }
      .space-context__heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #9ca7b9; font-size: 9px; }
      .space-context__heading a { display: inline-flex; align-items: center; min-height: 24px; padding-block: 3px; color: #c4baa7; text-decoration: none; }
      .space-context__heading a:hover { color: #f1dfb8; text-decoration: underline; }
      .space-context .space-context__path { margin-top: 4px; color: #d4d9e1; font-size: 11px; }
      .space-context .space-context__reference { color: #b9c4d5; font-size: 10px; }
      .space-context .space-context__simulation { margin-top: 4px; color: #93969f; font-size: 9px; }
      .guide-card__space { position: absolute; left: 0; bottom: 0; width: 100%; height: var(--guide-space-height); visibility: hidden; pointer-events: none; }
      .guide-tabs { display: flex; flex: none; gap: 18px; margin: 17px 22px 0; border-bottom: 1px solid #c2c9d220; }
      .guide-tabs button { min-height: 40px; padding: 0 0 9px; color: #93a0b1; border: 0; border-bottom: 1px solid transparent; background: transparent; font: inherit; font-size: 12px; cursor: pointer; }
      .guide-tabs button[aria-selected="true"] { color: #eddec1; border-bottom-color: #cdbb94; }
      .guide-tabs button:hover { color: #f1e4cb; }
      .guide-tabs button:focus-visible { outline: 2px solid #e9d3a4; outline-offset: 3px; }
      .guide-panel__hint { margin: 14px 0 10px; color: #a7b2c0; font-size: 11px; line-height: 1.7; }
      .related-search { width: 100%; height: 38px; padding: 0 10px; border: 1px solid #b5c5df35; border-radius: 5px; color: #eee7d9; background: #04080d66; font: inherit; font-size: 12px; }
      .related-search:focus-visible { outline: 2px solid #e9d3a4; outline-offset: 2px; }
      .body-relations { margin-top: 14px; color: #a2abb7; }
      .body-relations[hidden] { display: none; }
      .body-relations__group + .body-relations__group { margin-top: 16px; }
      .body-relations__group h3 { margin: 0 0 7px; color: #9ca8b9; font-size: 10px; font-weight: 400; }
      .body-relations__list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .body-relations button { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; min-height: 42px; padding: 9px 10px; border: 1px solid #b1c2db24; border-radius: 4px; color: #e1dfd6; background: #a4b4ce07; text-align: left; cursor: pointer; font: inherit; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
      .body-relations button::after { content: "↗"; color: #a99b80; }
      .body-relations button:hover { border-color: #b1c2db70; background: #b1c2db12; }
      .body-relations button[aria-current="true"] { border-color: #cdbb9470; }
      .body-relations button:focus-visible { outline: 2px solid #e9d3a4; outline-offset: 1px; }
      .body-relations button:disabled { opacity: .45; cursor: default; }
      .guide-card__text { margin: 13px 0 17px; color: #bcbcc0; font-size: 12px; line-height: 1.7; }
      .guide-card__actions { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
      .next-observation { display: block; width: 100%; margin-top: 15px; padding: 11px 0 0; border: 0; border-top: 1px solid #d4c6aa27; background: transparent; text-align: left; color: #decaa1; cursor: pointer; }
      .next-observation:hover { color: #f4e5c6; }
      .next-observation__name { display: block; font-size: 11px; line-height: 1.5; }
      .next-observation__reason { display: block; margin-top: 5px; color: #aeb0ba; font-size: 10px; line-height: 1.6; }
      .approach-button {
        min-height: 40px; padding: 0 17px; border: 1px solid #dbc6997a; border-radius: 3px;
        color: #f4e5c6; background: #87714b25; cursor: pointer; font-size: 11px;
      }
      .approach-button:hover { background: #87714b55; }
      .guide-card__detail { margin-top: 14px; color: #a9aaaf; font-size: 10px; line-height: 1.7; }
      .guide-card__detail summary { width: fit-content; cursor: pointer; color: #b9b6b0; }
      .guide-card__detail p { margin: 10px 0 7px; }
      .guide-card__detail a { color: #d4c6aa; text-decoration-color: #d4c6aa66; text-underline-offset: 3px; }
      .guide-card__detail a:not([hidden]) { display: block; margin-top: 6px; }
      .guide-card__disclosure { color: #92949c; }
      .destination-panel {
        position: absolute; top: 76px; right: 30px; width: min(360px, calc(100vw - 60px));
        padding: 18px; background: #070b14ef; border: 1px solid #eee9df25; border-radius: 5px;
        box-shadow: 0 18px 60px #0007; backdrop-filter: blur(24px);
        max-height: calc(100dvh - 160px); overflow-y: auto; overscroll-behavior: contain;
      }
      .destination-panel__heading { margin: 0 0 15px; color: #c1b9aa; font-size: 10px; font-weight: 400; letter-spacing: .1em; }
      .destination-browse__heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .destination-browse__heading h2 { margin: 0; }
      .destination-browse__heading button { min-height: 36px; padding: 0 10px; font-size: 10px; }
      .destination-browse__heading h2 { flex: 1; }
      .route-guide { display: block; max-width: 100%; margin-top: 12px; padding: 5px 0; border: 0; color: #c4b89c; background: transparent; text-align: left; font: inherit; font-size: 10px; line-height: 1.5; cursor: pointer; }
      .route-guide:hover { color: #f1dfb8; }
      .route-plan__name { margin: 15px 8px 8px; font: 23px 'Iowan Old Style', 'Songti SC', Georgia, serif; font-weight: 400; line-height: 1.3; }
      .route-plan__context { margin: 8px; color: #adb5c3; font-size: 11px; line-height: 1.7; }
      .route-plan__progress { margin: 12px 8px; color: #d5c59f; font-size: 11px; }
      .route-plan__source { display: inline-block; margin: 3px 8px 10px; color: #b8b2a5; font-size: 10px; text-underline-offset: 3px; }
      .route-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
      .route-actions .approach-button { flex: 1; }
      .route-stops .destination[data-visited="true"] .destination__arrow { color: #b9d0bb; }
      .route-step-number { color: #d5c59f; font-size: 11px; font-variant-numeric: tabular-nums; }
      .route-stops .destination[aria-current="true"] { border-color: #d4c6aa66; background: #cfbb8b0c; }
      @media (max-width: 360px) {
        .destination-browse__heading { flex-wrap: wrap; gap: 8px; }
        .destination-browse__heading h2 { flex-basis: 100%; }
      }
      .system-navigation__hint { margin: 0 8px 12px; color: #aaaeb9; font-size: 11px; line-height: 1.7; }
      .system-navigation__overview { width: 100%; min-height: 48px; padding: 10px 12px; margin-bottom: 8px; text-align: left; border: 1px solid #d4c6aa55; color: #e1d6be; background: #cfbb8b0c; font: inherit; font-size: 12px; cursor: pointer; }
      .system-navigation__overview:focus-visible { outline: 2px solid #d8c49a; outline-offset: 2px; }
      .system-navigation .destination { min-height: 56px; }
      .system-navigation .destination[data-nested="true"] { width: calc(100% - 26px); margin-left: 26px; border-left: 1px solid #b3c0d133; border-radius: 0; }
      .destination-browse { position: sticky; top: -18px; z-index: 1; margin: -18px -18px 0; padding: 18px; background: #080c16; border-bottom: 1px solid #eee9df18; }
      .destination-categories { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
      .destination-category { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; padding: 7px 10px; border: 1px solid transparent; border-bottom-color: #eee9df25; background: transparent; color: #aaaab1; text-align: left; font: inherit; font-size: 11px; cursor: pointer; }
      .destination-category span:last-child { color: #898d98; font-size: 10px; }
      .destination-category[aria-pressed="true"] { color: #eee9df; background: #cfbb8b0c; border-bottom-color: #d4c6aa; }
      .destination-category:hover, .destination-category:focus-visible { border-color: #d4c6aa66; outline: none; }
      .destination-category:disabled { opacity: .5; cursor: default; }
      .destination-result-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .destination-clear { flex-shrink: 0; min-height: 36px; padding: 8px; margin-top: 8px; border: 0; background: transparent; color: #d4c6aa; font: inherit; font-size: 10px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
      .destination-list { display: grid; gap: 4px; }
      .destination-section { margin: 16px 8px 6px; color: #c1b9aa; font-size: 10px; font-weight: 400; letter-spacing: .08em; }
      .destination-session-hint { margin: 6px 8px 8px; color: #92949c; font-size: 10px; line-height: 1.6; }
      .destination-search { width: 100%; height: 42px; padding: 0 12px; margin: 0 0 12px; border: 1px solid #eee9df2d; border-radius: 3px; color: var(--ink); background: #ffffff05; font: inherit; font-size: 12px; }
      .destination-search:focus-visible { outline: 1px solid #d8c49a; outline-offset: 2px; }
      .destination-search::placeholder { color: #9b9ba5; }
      .destination-search-hint, .destination-empty { margin: 10px 8px; color: #b3b0aa; font-size: 11px; line-height: 1.7; }
      .destination {
        display: grid; grid-template-columns: 22px 1fr 14px; gap: 10px; align-items: center; width: 100%;
        min-height: 65px; padding: 11px 12px; border: 1px solid transparent; border-radius: 3px;
        background: transparent; text-align: left; color: var(--ink); cursor: pointer;
      }
      .destination:hover, .destination:focus-visible { background: #ffffff08; border-color: #eee9df27; }
      .destination[aria-current="true"] { background: #cfbb8b0c; }
      .destination[data-body-kind="planet"] .destination__star, .destination[data-body-kind="dwarfplanet"] .destination__star, .destination[data-body-kind="moon"] .destination__star { box-shadow: none; position: relative; background: radial-gradient(circle at 30% 25%, #d9e4ef, var(--star-color) 45%, #172c4b); }
      .destination[data-material="saturn"] .destination__star::after { content: ""; position: absolute; width: 19px; height: 6px; border: 1px solid #d3bd8a; border-radius: 50%; left: -5px; top: 1px; transform: rotate(-20deg); }
      .destination[data-body-kind="nebula"] .destination__star { width: 14px; height: 10px; border-radius: 42% 58% 63% 37%; background: radial-gradient(ellipse at 38% 40%, #d8c4f6, #9a629e 38%, #e87c9d 60%, transparent 78%); box-shadow: 0 0 9px #d87a9b55; }
      .destination[data-body-kind="galaxy"] .destination__star { width: 17px; height: 8px; transform: rotate(-25deg); border-radius: 50%; background: radial-gradient(ellipse, #fff3d1 5%, #d9b785 24%, #7298c3 56%, transparent 78%); box-shadow: 0 0 10px #d9b78544; }
      .destination[data-body-kind="comet"] .destination__star { position: relative; width: 8px; height: 8px; background: #b6d8df; box-shadow: 0 0 8px #79bad866; }
      .destination[data-body-kind="comet"] .destination__star::after { content: ""; position: absolute; width: 16px; height: 6px; right: 4px; top: 4px; transform: rotate(-32deg); transform-origin: right center; background: linear-gradient(to left, #87b6c9a0, transparent); border-radius: 100% 20% 20% 100%; }
      .destination[data-body-kind="pulsar"] .destination__star { position: relative; width: 8px; height: 8px; background: #b4dcf6; box-shadow: 0 0 8px #84c7ee88; }
      .destination[data-body-kind="pulsar"] .destination__star::after { content: ""; position: absolute; width: 3px; height: 26px; left: 2px; top: -9px; transform: rotate(-28deg); background: linear-gradient(transparent, #84c7eeaa 30%, #c9e9fc 50%, #84c7eeaa 70%, transparent); }
      .destination[data-body-kind="blackhole"] .destination__star { width: 11px; height: 11px; background: #030509; border: 1px solid #edb366; box-shadow: 0 0 8px #e8ab6255; position: relative; }
      .destination[data-body-kind="blackhole"] .destination__star::after { content: ""; position: absolute; width: 21px; height: 6px; left: -6px; top: 1px; border: 1px solid #d99242; border-radius: 50%; transform: rotate(-20deg); }
      .destination__star { width: 10px; height: 10px; border-radius: 50%; background: var(--star-color); box-shadow: 0 0 12px var(--star-color); }
      .destination__name { display: block; font-size: 13px; font-weight: 400; }
      .destination__reason { display: block; margin-top: 5px; font-size: 10px; color: #aaaab1; line-height: 1.5; }
      .destination__arrow { color: #b5a58a; }
      .destination-panel__note { margin: 15px 8px 2px; color: #898d98; font-size: 9px; line-height: 1.6; }
      .scene-motion { margin-top: 12px; border-bottom: 1px solid #eee9df18; }

      .scene-motion summary:focus-visible { outline: 1px solid #d8c49a; outline-offset: 2px; }
      .scene-motion fieldset { display: flex; gap: 5px; margin: 2px 8px 0; padding: 0; border: 0; }
      .scene-motion label { position: relative; flex: 1; min-height: 40px; padding: 11px 6px; border: 1px solid #eee9df2d; text-align: center; color: #aaaeb9; font-size: 11px; cursor: pointer; }

      .destination-locate:hover,.destination-locate:focus-visible { background:#d7c9ab14;color:#eee0c2; }
      .destination-row:has(:focus-visible),.destination-row:hover { background:#d7c9ab08; }
      .destination-peek { position:absolute;z-index:6;left:16px;top:120px;width:min(620px,calc(100vw - 32px));padding:14px 18px;border:1px solid #8c857363;border-radius:10px;background:#080e16f5;box-shadow:0 8px 30px #0005;pointer-events:auto;display:flex;align-items:center;gap:18px; }
      .destination-peek__subject { min-width:0;flex:1; }
      .destination-peek__name { margin:0;color:#ede4ce;font-size:16px;font-weight:400; }
      .destination-peek__direction { min-height:1.4em;line-height:1.4;margin:5px 0 0;font-size:11px;color:#aab6c6; }
      .destination-peek__actions { display:flex;gap:8px;flex-shrink:0; }
      .observatory[data-locating="true"] .guide-card,.observatory[data-locating="true"] .guide-restore { visibility:hidden; }
      @media(max-width:700px) { .destination-peek { flex-wrap:wrap;gap:10px;padding:12px 14px; } .destination-peek__subject { flex-basis:100%; } .destination-peek__actions { width:100%; } .destination-peek__actions button { flex:1; } }
      .destination--catalog { min-height:72px; padding-block:10px; }
      .destination--catalog .destination__reason { margin-top:4px; font-size:12px; line-height:1.5; }
      .destination--catalog .destination__direction { margin-top:4px; }
      .destination__reason { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
      @media (max-height:500px) {
        .destination-view-hint { display:none; }
        .destination-view-filter { margin:10px 0 6px; }
        .destination-view-filter button { min-height:32px; }
        .destination__reason { -webkit-line-clamp:1; }
      }

      /* The held view and its controls share one quiet observation frame. */
      .observatory-masthead {
        position:absolute;top:max(24px,env(safe-area-inset-top));left:max(32px,env(safe-area-inset-left));right:max(32px,env(safe-area-inset-right));
        display:grid;grid-template-columns:128px minmax(0,1fr) auto;column-gap:26px;row-gap:4px;align-items:start;
        padding:12px 18px 9px;border:1px solid #b5c5df20;border-bottom-color:#d5c5a44d;border-radius:10px;
        background:var(--observatory-surface);backdrop-filter:blur(16px);box-shadow:0 8px 32px #0003;
      }
      .identity { padding-top:4px; }
      .identity__name { margin:0;color:#eee9df;font-size:13px;font-weight:500;letter-spacing:.24em; }
      .identity__caption { margin:8px 0 0;color:#99a8bb;font-size:9px;letter-spacing:.1em; }
      .observation-hud { position:static;min-width:0;pointer-events:none;text-shadow:none; }
      .observation-context { display:grid;grid-template-columns:minmax(100px,.8fr) minmax(0,1.4fr);align-items:center;gap:18px;min-height:40px;visibility:hidden; }
      .observatory[data-state="ready"] .observation-context { visibility:visible; }
      .position-readout { display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 12px;margin:0;line-height:1.5; }
      .position-readout__scale,.position-readout__region { color:#a9b6c6;font-size:10px; }
      .position-readout__scale { letter-spacing:.06em; }
      .position-readout__body { color:#eee8db;font:400 21px/1.3 'Iowan Old Style','Songti SC',Georgia,serif;overflow-wrap:anywhere; }
      .position-readout__region { flex-basis:100%; }
      .navigation-state { display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:34px;margin-top:0; }
      .navigation-feedback { margin:0;color:#d9c9a5;font-size:11px;line-height:1.55; }
      .journey-controls { grid-column:2;pointer-events:auto; }
      .journey-controls .quiet-button { min-height:32px;padding:4px 10px;border-color:#d6bd7c55;background:#d6bd7c12;color:#ebd9b4;font-size:11px;white-space:nowrap; }
      .toolbar { position:static;display:flex;gap:6px;padding-top:1px; }
      .toolbar .quiet-button { min-height:40px;padding-inline:14px;border-radius:6px;font-size:11px;background:transparent;backdrop-filter:none; }
      .toolbar [data-testid="open-destinations"] { background:#ddd1b7;color:#171c24;border-color:#f3e9d0aa; }
      .toolbar [data-testid="open-destinations"]:hover,.toolbar [data-testid="open-destinations"][aria-expanded="true"] { background:#f1e4c7;color:#171c24; }
      .masthead-action__compact { display:none; }
      .observatory-masthead__notes { position:relative;grid-column:1/-1;min-height:27px;padding-top:7px;border-top:1px solid #b5c5df18; }
      .space-map-hint { width:57%;margin:0;color:#8494aa;font-size:9px;line-height:1.5; }
      .status { position:absolute;top:7px;right:0;width:41%;margin:0;color:#b7c2d1;font-size:10px;line-height:1.5;text-align:right;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
      .status[data-hidden="true"] { visibility:hidden; }
      .observatory[data-navigation="flying"] .status[data-kind="hint"],
      .observatory[data-navigation="paused"] .status[data-kind="hint"],
      .observatory[data-navigation="returning"] .status[data-kind="hint"],
      .observatory[data-navigation="zooming"] .status[data-kind="hint"] { visibility:hidden; }
      .observatory[data-explorer="true"] .observation-context,.observatory[data-explorer="true"] .observatory-masthead__notes { visibility:hidden; }
      .observatory:not([data-state="ready"]) .observatory-masthead { visibility:visible; }
      .observatory:not([data-state="ready"]) .toolbar,.observatory:not([data-state="ready"]) .space-map-hint { visibility:hidden; }
      @media(max-width:1000px) {
        .observatory-masthead { grid-template-columns:1fr auto;column-gap:12px;row-gap:7px; }
        .identity { grid-column:1;grid-row:1; }
        .toolbar { grid-column:2;grid-row:1; }
        .observation-hud { grid-column:1/-1;grid-row:2; }
        .position-readout__body { font-size:20px; }
        .observation-context { grid-template-columns:minmax(100px,.8fr) minmax(0,1.4fr); }
      }
      @media(max-width:700px) {
        .observatory-masthead { top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));padding:10px 12px 8px;row-gap:5px;column-gap:6px; }
        .identity { padding-top:9px; }
        .identity__name { font-size:11px;letter-spacing:.17em; }
        .identity__caption { display:none; }
        .toolbar { gap:3px;padding-top:0; }
        .toolbar .quiet-button { min-height:36px;min-width:36px;padding-inline:8px;font-size:10px; }
        .masthead-action__full { display:none; }
        .masthead-action__compact { display:inline; }
        .position-readout { gap:2px 9px; }
        .observation-context { grid-template-columns:minmax(82px,.75fr) minmax(0,1.4fr);gap:9px; }
        .observation-context:has(.navigation-feedback[hidden]) { grid-template-columns:minmax(0,1fr); }
        .navigation-state:has(.navigation-feedback[hidden]) { display:none; }
        .position-readout__body { font-size:18px; }
        .position-readout__scale,.position-readout__region { font-size:9px; }
        .navigation-state { min-height:32px;margin-top:0;gap:6px; }
        .navigation-feedback { font-size:10px; }
        .journey-controls .quiet-button { padding-inline:8px;font-size:10px; }
        .observatory-masthead__notes { min-height:43px;padding-top:6px; }
        .space-map-hint { font-size:8px;line-height:1.5; }
        .status { top:6px;font-size:9px;-webkit-line-clamp:3; }
      }
      @media(max-width:700px) and (min-height:501px) and (max-height:700px) {
        .observatory-masthead { padding:8px 10px 6px;row-gap:3px; }
        .identity { padding-top:7px; }
        .toolbar .quiet-button { min-height:32px;padding-inline:7px; }
        .observation-context { min-height:32px; }
        .observatory-masthead__notes { min-height:34px;padding-top:5px; }
        .space-map-hint { font-size:9px;line-height:1.45; }
        .status { top:5px;-webkit-line-clamp:2; }
      }
      @media(max-height:500px) {
        .observatory-masthead { top:12px;left:18px;right:18px;padding:8px 12px 6px;row-gap:3px; }
        .identity__caption { display:none; }
        .position-readout__body { font-size:17px; }
        .navigation-state { min-height:32px;margin-top:0; }
        .toolbar .quiet-button { min-height:34px;padding-inline:10px; }
        .observatory-masthead__notes { min-height:26px;padding-top:4px; }
        .space-map-hint { font-size:8px; }
        .status { top:4px;font-size:9px; }
      }
      @media(min-width:701px) and (max-height:500px) {
        .observatory-masthead { grid-template-columns:95px minmax(0,1fr) auto;column-gap:16px; }
        .identity,.toolbar,.observation-hud { grid-row:1; }
        .identity { grid-column:1; }
        .observation-hud { grid-column:2; }
        .toolbar { grid-column:3; }
        .masthead-action__full { display:none; }
        .masthead-action__compact { display:inline; }
      }
    </style>
  </head>
  <body>
    <main class="observatory" id="observatory" data-state="loading">
      <canvas class="scene-canvas" id="scene" data-testid="star-map" role="application" tabindex="0"
        aria-label="Interactive cosmic observatory" aria-describedby="interaction-guide"
        aria-keyshortcuts="+ - ArrowUp ArrowDown ArrowLeft ArrowRight Home Escape" aria-busy="true"></canvas>
      <canvas class="label-canvas" id="labels" aria-hidden="true"></canvas>
      <div class="controls" id="controls">
        <header class="observatory-masthead" data-testid="observatory-masthead">
          <div class="identity" data-testid="observatory-identity"><p class="identity__name">UNIVERSE</p><p class="identity__caption" data-copy="observatory"></p></div>
          <aside class="observation-hud" data-testid="observation-hud" data-copy-label="observationContext">
            <div class="observation-context" data-testid="observation-context">
              <p class="position-readout" data-field="position" data-testid="position-readout"><span class="position-readout__scale" data-field="position-scale"></span><span class="sr-only" data-field="position-relation"></span><strong class="position-readout__body" data-field="position-body"></strong><span class="position-readout__region" data-field="position-region" hidden></span></p>
              <div class="navigation-state">
                <p class="navigation-feedback" data-field="navigation-feedback" data-testid="navigation-feedback" role="status" aria-live="polite" aria-atomic="true" hidden></p>
                <div class="journey-controls"><button class="quiet-button" type="button" data-action="stop" data-testid="stop-flight" data-copy="stop" hidden></button><button class="quiet-button" type="button" data-action="resume" data-testid="resume-flight" hidden></button></div>
              </div>
            </div>
          </aside>
          <nav class="toolbar" data-testid="observatory-navigation" data-copy-label="navigation">
            <button class="quiet-button" type="button" data-action="overview" data-testid="return-overview" data-copy-label="overview"><span class="masthead-action__full" data-copy="overview"></span><span class="masthead-action__compact" data-copy="overviewCompact" aria-hidden="true"></span></button>
            <button class="quiet-button" type="button" data-action="space-overview" data-testid="space-overview" data-copy-label="wideOverview"><span class="masthead-action__full" data-copy="wideOverview"></span><span class="masthead-action__compact" data-copy="wideCompact" aria-hidden="true"></span></button>
            <button class="quiet-button" type="button" data-action="destinations" data-testid="open-destinations" data-copy-label="destinations" aria-expanded="false" aria-controls="destinations" aria-keyshortcuts="/"><span class="masthead-action__full" data-copy="destinations"></span><span class="masthead-action__compact" data-copy="destinationsCompact" aria-hidden="true"></span></button>
          </nav>
          <div class="observatory-masthead__notes">
            <p class="space-map-hint" data-field="map-hint" data-copy="mapHint"></p>
            <div class="status" id="status" data-testid="operation-feedback" role="status" aria-live="polite" aria-atomic="true"></div>
          </div>
        </header>
        <section class="guide-card" id="target-guide" data-testid="target-guide" aria-labelledby="target-name">
          <button class="quiet-button guide-card__hide" type="button" data-action="guide" data-testid="hide-guide" data-copy-label="hideGuide" aria-controls="target-guide" aria-expanded="true">×</button>
          <div class="guide-card__space" aria-hidden="true"></div>
          <div class="guide-card__content">
          <div class="guide-card__header">
          <p class="guide-card__eyebrow" data-field="eyebrow"></p>
          <h1 class="guide-card__name" id="target-name" data-field="name"></h1>
          <p class="guide-card__type" data-field="type"></p><p class="object-evidence" data-field="object-evidence"></p>
          </div>
          <div class="guide-tabs" data-testid="guide-tabs" role="tablist" data-copy-label="guideSections">
            <button type="button" role="tab" id="guide-observe-tab" data-action="guide-view" data-guide-view="observe" data-testid="guide-observe" aria-controls="guide-observe-panel" aria-selected="true" data-copy="guideObserve"></button>
            <button type="button" role="tab" id="guide-read-tab" data-action="map-details" data-guide-view="read" data-testid="map-details" aria-controls="observation-details" aria-selected="false" aria-expanded="false" tabindex="-1" data-copy="guideRead"></button>
            <button type="button" role="tab" id="guide-related-tab" data-action="guide-view" data-guide-view="related" data-testid="guide-related" aria-controls="guide-related-panel" aria-selected="false" tabindex="-1" data-copy="guideRelated" hidden></button>
          </div>
          <div class="guide-card__body" role="region" aria-labelledby="target-name" tabindex="0" data-testid="body-reading">
          <section id="guide-observe-panel" data-guide-panel="observe" role="tabpanel" aria-labelledby="guide-observe-tab">
          <button class="route-guide" type="button" data-action="route-navigation" data-testid="route-guide" aria-controls="exploration-routes" hidden></button>
          <p class="guide-card__text" data-field="invitation"></p>
          <div class="guide-card__actions">
            <button class="approach-button" type="button" data-action="system-navigation" data-testid="guide-system-members" data-copy="systemChoose" hidden></button>
            <button class="quiet-button" type="button" data-action="system-inner-overview" data-testid="guide-inner-system" hidden></button>
            <button class="quiet-button" type="button" data-action="system-overview" data-testid="guide-solar-overview" data-copy="systemOverview" hidden></button>
            <button class="approach-button" type="button" data-action="approach" data-testid="approach-target"></button>
            <button class="quiet-button" type="button" data-action="nearer" data-testid="zoom-in" data-copy="closer" hidden></button>
            <button class="quiet-button" type="button" data-action="system-local-overview" data-testid="guide-local-system" hidden></button>
          </div>
          <section class="galaxy-regions" data-testid="galaxy-regions" aria-labelledby="galaxy-regions-heading" hidden>
            <h3 id="galaxy-regions-heading" data-copy="galaxyRegions"></h3>
            <p data-copy="galaxyRegionHint"></p>
            <div class="galaxy-regions__choices" data-testid="galaxy-region-options"></div>
            <button class="quiet-button" type="button" data-action="galaxy-whole" data-testid="galaxy-whole" data-copy="galaxyWhole" hidden></button>
          </section>
          <button class="next-observation" type="button" data-testid="next-observation" hidden><span class="next-observation__name" data-field="next-name"></span><span class="next-observation__reason" data-field="next-reason"></span></button>
          </section>
          <section id="observation-details" data-guide-panel="read" role="tabpanel" aria-labelledby="guide-read-tab" hidden>
          <div class="space-context" data-testid="space-context" role="group" data-copy-label="spaceContext" hidden>
            <p class="space-context__heading"><span data-copy="realLocation"></span><a data-field="space-source" data-testid="space-source" target="_blank" rel="noopener noreferrer"></a></p>
            <p class="space-context__path" data-field="space-path" data-testid="space-path"></p>
            <p class="space-context__reference" data-field="space-reference" data-testid="space-reference" hidden></p>
            <p class="space-context__simulation" data-copy="spaceSimulation"></p>
          </div>
          <details class="guide-card__detail" data-testid="target-details">
            <summary data-copy="about"></summary>
            <p data-field="story"></p>
            <p data-field="fact"></p>
            <a data-field="source" data-testid="target-source" target="_blank" rel="noopener noreferrer"></a>
            <a data-field="observation-source" data-testid="target-observation-source" target="_blank" rel="noopener noreferrer" hidden></a>
            <a data-field="shape-source" data-testid="target-shape-source" target="_blank" rel="noopener noreferrer" hidden></a>
            <a data-field="map-source" data-testid="target-map-source" target="_blank" rel="noopener noreferrer" hidden></a>
            <p class="guide-card__disclosure" data-copy="representation"></p>
          </details>
            <button class="quiet-button" type="button" data-action="terrain" data-copy="terrain" data-testid="guide-observe-terrain" hidden></button>
          </section>
          <section id="guide-related-panel" data-guide-panel="related" role="tabpanel" aria-labelledby="guide-related-tab" hidden>

            <input class="related-search" type="search" maxlength="80" autocomplete="off" spellcheck="false" data-testid="related-search" data-copy-label="relatedSearch" data-copy-placeholder="relatedSearch" />
            <div class="body-relations" data-testid="body-relations" role="group" hidden></div>
            <p class="guide-panel__hint" data-testid="related-empty" data-copy="noResults" role="status" hidden></p>
          </section>
          </div>
          </div>
        </section>
        <button class="quiet-button guide-restore" type="button" data-action="guide" data-testid="restore-guide" data-copy="showGuide" aria-controls="target-guide" aria-expanded="false" hidden></button>
        <section class="destination-panel" id="destinations" data-testid="destinations" aria-labelledby="destinations-heading" hidden>
          <div class="destination-browse">
          <div class="destination-browse__heading">
          <h2 class="destination-panel__heading" id="destinations-heading" data-copy="destinations"></h2><button class="explorer-close quiet-button" type="button" data-action="destinations" data-testid="close-destinations" data-copy-label="closeExplorer">×</button>
          <button class="quiet-button" type="button" data-action="route-navigation" data-testid="navigation-routes" data-copy="routes" aria-controls="exploration-routes" aria-expanded="false"></button>
          <button class="quiet-button" type="button" data-action="system-navigation" data-testid="navigation-system" data-copy="solarFamily" aria-controls="solar-navigation" aria-expanded="false"></button>
          <button class="quiet-button" type="button" data-action="dynamics" data-testid="navigation-dynamics" data-copy="dynamics" data-copy-label="sceneMotion" aria-controls="destinations"></button>
          <button class="quiet-button" type="button" data-action="browse-navigation" data-testid="navigation-browse" data-copy="browseBodies" hidden></button>
          </div>
          <div class="destination-query" data-testid="navigation-query">
          <input class="destination-search" type="search" maxlength="80" autocomplete="off" spellcheck="false" data-testid="star-search" data-field="search" data-copy-label="search" />
          <button class="quiet-button" type="button" data-action="destination-filters" data-testid="destination-filters-return" data-copy="refineDestinations" aria-controls="destination-filters"></button>
          </div>
          </div>
          <div class="destination-content" data-testid="navigation-content">
          <div id="destination-filters">
          <div class="destination-regions" data-testid="destination-regions" role="group" data-copy-label="spaceScope"></div>
          <div class="destination-categories" data-testid="destination-categories" role="group" data-copy-label="categories"></div>

            <div class="destination-list" data-field="recent-views"></div>
          </section>
          <div class="destination-result-heading">
            <h3 class="destination-section" data-field="destination-scope"></h3>
            <button class="destination-clear" type="button" data-action="clear-search" data-testid="clear-search" data-copy="clearSearch" hidden></button>
          </div>
          <div class="destination-list" data-field="destinations"></div>
          <p class="destination-empty" data-testid="destination-empty" data-copy="noResults" hidden></p>
          <p class="destination-search-hint" data-field="search-hint"></p>
          <p class="destination-panel__note" data-copy="representation"></p>

              <div class="route-actions">
                <button class="approach-button" type="button" data-action="route-next" data-testid="route-next"></button>
                <button class="quiet-button" type="button" data-action="route-leave" data-testid="route-leave" data-copy="routeLeave" hidden></button>

              <div class="destination-list route-stops" data-testid="route-stops"></div>
            </div>
            <p class="destination-panel__note" data-copy="routeHint"></p>
          </section>
          <details class="scene-motion" data-testid="scene-motion-controls" hidden>

      <div class="unsupported" id="unsupported" role="alert"><div class="unsupported__text" id="unsupported-text"></div></div>
    </main>

    <script type="module">
      const BUILD_VERSION = "cosmic-explore-20261010gu";
      const runtimeUrl = new URL("./assets/stars-observatory-runtime.js", window.location.href);
      runtimeUrl.searchParams.set("v", BUILD_VERSION);
      try {
        const { bootStarsObservatory } = await import(runtimeUrl.href);
        bootStarsObservatory({
          root: document.getElementById("observatory"),
          controls: document.getElementById("controls"),
          scene: document.getElementById("scene"),
          labels: document.getElementById("labels"),
          scaleAxis: document.getElementById("scale-axis"),
          instructions: document.getElementById("interaction-guide"),
          status: document.getElementById("status"),
          debug: document.getElementById("debug"),
          unsupported: document.getElementById("unsupported"),
          unsupportedText: document.getElementById("unsupported-text")
        });
      } catch (error) {
        const language = new URLSearchParams(location.search).get("lang") || navigator.language || "en";
        const message = language.toLowerCase().startsWith("zh")
          ? "观测台未能启动。请刷新页面重试。"
          : "The observatory could not start. Please reload to try again.";
        document.getElementById("observatory").dataset.state = "unavailable";
        document.getElementById("scene").setAttribute("aria-busy", "false");
        document.getElementById("unsupported-text").textContent = message;
        document.getElementById("unsupported").dataset.visible = "true";
        console.error("Observatory startup failed", error);
      }
    </script>
